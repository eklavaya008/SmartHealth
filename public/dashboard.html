<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Smart Healthcare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/" class="nav-logo">
                    <img src="/assets/smart-health-logo.svg" alt="Smart Health Logo" class="logo-img">
                    <h2><span class="logo-smart">Smart</span><span class="logo-health">Health</span></h2>
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="dashboard-section">
            <div class="container">
                <div class="dashboard-header">
                    <h1>Doctor Dashboard</h1>
                    <p id="doctorInfo">Welcome, <span id="doctorName">Doctor</span></p>
                </div>

                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <h3 id="totalAppointments">0</h3>
                        <p>Total Appointments</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="pendingAppointments">0</h3>
                        <p>Pending</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="confirmedAppointments">0</h3>
                        <p>Confirmed</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="completedAppointments">0</h3>
                        <p>Completed</p>
                    </div>
                </div>

                <div class="appointments-section">
                    <h2>Your Appointments</h2>
                    <div id="appointmentsList" class="appointments-list">
                        <p class="loading">Loading appointments...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Smart Healthcare Appointment System. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/animations.js"></script>
</body>
</html>
