<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Smart Healthcare</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/" class="nav-logo">
                    <img src="/assets/smart-health-logo.svg" alt="Smart Health Logo" class="logo-img">
                    <h2><span class="logo-smart">Smart</span><span class="logo-health">Health</span></h2>
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/login" class="active">Login</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <section class="login-section">
            <div class="container">
                <div class="login-card">
                    <h2>Doctor Login</h2>
                    <p class="subtitle">Access your dashboard to manage appointments</p>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
                        <div id="loginMessage" class="form-message"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Smart Healthcare Appointment System. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/animations.js"></script>
</body>
</html>
